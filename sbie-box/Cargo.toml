[package]
name = "sbie-box"
version = "0.1.0"
edition = "2021"
description = "Local Sandboxie-Plus box/snapshot manager (CLI + MCP), no network."

[lib]
name = "sbiebox"
path = "src/lib.rs"

[[bin]]
name = "sbie-box"
path = "src/bin/cli.rs"

[[bin]]
name = "sbie-mcp"
path = "src/bin/mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
